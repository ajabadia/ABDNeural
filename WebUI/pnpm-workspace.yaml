# Workspace pnpm de la WebUI.
#
# Es SU PROPIO workspace por el mismo motivo por el que lo era el del piloto: el
# workspace raíz de la suite (D:/desarrollos/ABDSynths/pnpm-workspace.yaml) NO
# lista esta carpeta, así que sin este fichero `pnpm install` desde WebUI camina
# hacia arriba, resuelve las dependencias en el lock raíz y `WebUI/node_modules`
# se queda SIN enlaces a los dos paquetes compartidos (el síntoma es un build que
# no encuentra `@abdsynths/shared`). Con él, la WebUI es su propio workspace y los
# compartidos son miembros, de modo que el `@abdsynths/shared@workspace:*` interno
# de midi-keyb resuelve aquí dentro, zero-copy.
#
# Antes esto lo hacía el workspace anidado del piloto
# (`WebPilot/pnpm-workspace.yaml`, que listaba `'../WebUI'`); ese fichero se fue
# con la retirada del piloto (ticket 8.4) y la WebUI se queda con el suyo.
packages:
  - '.'
  - '../../ABDSharedAssets'
  - '../../ABDSharedCode/MidiKeyboard'
# allowBuilds, Y POR QUE NO onlyBuiltDependencies. pnpm >= 11 dejo de leer
# `onlyBuiltDependencies`, ni aqui ni en el campo `pnpm` de package.json. Con la
# clave vieja el install termina el trabajo y sale con 1: ERR_PNPM_IGNORED_BUILDS,
# que es el peor resultado posible porque un install que parece hecho y no lo
# esta. Es la misma tabla que la del workspace raiz de la suite, y con los
# mismos motivos:
#
#   esbuild   -> true: su postinstall deja el binario en su sitio, y sin el no
#               funcionan ni el vite ni el vitest de esta WebUI.
#   puppeteer -> false: lo trae ABDSharedCode/MidiKeyboard como devDependency y
#               solo lo usa `MidiKeyboard/demo/capture.mjs`, que graba el gif de
#               la demo. NINGUN test de este workspace lo necesita. Su
#               postinstall descarga ~150 MB de Chromium. Para cuando haga
#               falta, y solo entonces:
#               `PUPPETEER_SKIP_DOWNLOAD=0 pnpm rebuild puppeteer`.
#
# MEDIDO 2026-10-03 sobre `node_modules/.pnpm` de este workspace: son
# EXACTAMENTE estos dos los paquetes con `preinstall`/`install`/`postinstall`, y
# por eso la tabla no cita `core-js` ni `midi` como la del workspace raiz. False
# NO es lo mismo que no mencionarlo: mencionarlo deja constancia de que se ha
# revisado, que es justo lo que evita volver a preguntar en el proximo install.
allowBuilds:
  esbuild: true
  puppeteer: false
