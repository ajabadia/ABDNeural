name: WebUI Visual QA

# El `name:` de arriba se queda como esta a proposito. Renombrar el workflow
# cambia el nombre de los REQUIRED STATUS CHECKS, y las reglas de proteccion de
# rama que lo nombran se quedan apuntando a un check que ya no existe: la rama
# deja de proteger en silencio. Si se quiere renombrar, es un paso aparte y
# deliberado, con las reglas de proteccion actualizadas a la vez.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    paths:
      # ── Regresion visual (lo que cubria este workflow antes) ────────────────
      - "WebUI/e2e/**"
      - "WebUI/src/**"
      - "WebUI/index.html"
      - "WebUI/playwright.config.js"
      - "WebUI/package.json"
      - "WebUI/pnpm-lock.yaml"
      - "WebUI/pnpm-workspace.yaml"
      # ── vitest ─────────────────────────────────────────────────────────────
      - "WebUI/tests/**"
      # ── ctest ──────────────────────────────────────────────────────────────
      - "Tests/**"
      - "Source/**"
      - "CMakeLists.txt"
      - "wasm/**"
      - "build_wasm.bat"
      - "build.bat"
      # El rodeo de junctions y su documentacion. MEDIDO: sin esta linea, cambiar
      # el script no dispara este workflow, o sea que un arreglo en el no se
      # prueba nunca en CI - que es justo lo que pasa si se arregla para que CI
      # deje de depender de que los enlaces se escriban solos.
      - "Scripts/junctions-workspace.bat"
      - "start.bat"
      - "sync_wasm.bat"
      - "watch_then_rebuild_wasm.sh"
      - "watch_tree_quiet.sh"
      - ".gitattributes"
      - ".github/workflows/webui-visual-qa.yml"

permissions:
  contents: read

concurrency:
  group: webui-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 1. REGRESION VISUAL. Sin cambios: es lo que hacia este workflow y ya
  #    funciona. Lo que se anade son los otros dos jobs, no este.
  # ==========================================================================
  visual-regression:
    name: Playwright visual regression (Chromium)
    # Las referencias de WebUI/e2e/snapshots/ se generaron en Chromium/Windows: la
    # pagina no carga ninguna webfont (usa `system-ui`) y su rasterizado cambia
    # entre sistemas operativos, asi que un baseline de Windows sobre un runner
    # Linux fallaria por antialiasing y no por el codigo. `runs-on: windows-latest`
    # es un requisito del test, no una preferencia.
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CI: true

    steps:
      # ── Layout de HERMANOS ─────────────────────────────────────────────────
      # El WebUI declara `@abdsynths/shared` y `@abdsynths/midi-keyb` como
      # "workspace:*", y esos paquetes NO estan publicados en ningun registry:
      # solo existen como repos hermanos. Por eso los tres checkout van como
      # hermanos en la raiz del workspace, igual que en local.
      #
      # POR QUE NO SE REUSA la accion `ajabadia/ABDSharedCode/.github/actions/
      # pnpm-workspace-bootstrap` (que es la que usan ABDMS2000 y ABDEep): esa
      # accion instala en la RAIZ del workspace y verifica
      # `<proyecto>/node_modules/@abdsynths/*`, y el layout de NEURONiK es
      # distinto — su workspace es `WebUI/` (WebUI/pnpm-workspace.yaml, con su
      # propio lock), asi que los enlaces caen en
      # `ABDNeural/WebUI/node_modules/@abdsynths/*` y el install va ahi. Copiar
      # el layout a mano es lo que hace falta, no adaptar la accion.
      - name: Checkout ABDNeural (este repo)
        uses: actions/checkout@v4
        with:
          path: ABDNeural

      - name: Checkout ABDSharedCode (@abdsynths/midi-keyb)
        uses: actions/checkout@v4
        with:
          repository: ajabadia/ABDSharedCode
          path: ABDSharedCode

      - name: Checkout ABDSharedAssets (@abdsynths/shared)
        uses: actions/checkout@v4
        with:
          repository: ajabadia/ABDSharedAssets
          path: ABDSharedAssets

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Con lock versionado (WebUI/pnpm-lock.yaml), al reves que en el hermano:
      # aqui el install SI es reproducible y `--frozen-lockfile` lo dice.
      # `PUPPETEER_SKIP_DOWNLOAD`: MidiKeyboard lo trae como devDependency y
      # son ~150 MB que este job no usa (el navegador es el de Playwright).
      - name: Install WebUI dependencies
        shell: bash
        working-directory: ABDNeural/WebUI
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # El fallo de este bootstrap es silencioso: `pnpm install` puede salir en
      # verde y dejar los `workspace:*` sin enlazar, y el error sale veinte
      # pasos mas tarde, en Vite, sin mencionar el workspace. Se comprueba aqui.
      #
      # LOS ENLACES COMO JUNCTIONS, con el MISMO rodeo que en local. Va justo
      # despues de la comprobacion de arriba y antes de cualquier paso de la
      # WebUI, porque los dos miran lo mismo desde dos lados: el paso de arriba
      # dice que el enlace EXISTE, y este dice que ademas RESUELVE.
      #
      # MEDIDO el 2026-10-03, y por que hace falta aunque `pnpm install` deberia
      # escribirlos bien. En el runner de Windows, `pnpm` deja los `workspace:*`
      # como enlaces de pnpm, y hay un caso MEDIDO en local en el que eso no
      # resuelve: si el enlace se escribe con la ruta tal cual la ve el shell
      # (POSIX), Node la lee como `D:\d\...` y apunta a un sitio que no existe.
      # El sintoma no lo dice el enlace -el paquete parece estar- y sale en Vite
      # con un "Rollup failed to resolve import" veinte pasos mas tarde, sin
      # mencionar el workspace. Este paso convierte eso en un rojo que dice
      # cual es, en el sitio donde se puede arreglar.
      #
      # `NEURONIK_SUITE` es OBLIGATORIO aqui y no opcional: el script trae
      # `D:\desarrollos\ABDSynths` como valor por defecto para que en local
      # funcione sin configurar nada, y en el runner ese sitio NO existe. Sin
      # la variable el script se iria ahi, no encontraria a los hermanos, y
      # MEDIDO: aun asi imprimia "RESULTADO: OK, 6 repos revisados", o sea un
      # verde que no habia mirado nada. Por eso el script ahora CUENTA como
      # fallo un repo de su lista que no exista, que es lo que hacia posible
      # ese falso verde.
      #
      # OJO con el orden: este paso va DESPUES del `pnpm install` de mas arriba,
      # que es el que deja los enlaces. Antes de un install no hay nada que
      # arreglar, y el script se saldria en verde sin haber mirado un enlace.
      - name: Fix the workspace links as junctions (junctions-workspace.bat)
        shell: cmd
        working-directory: ABDNeural
        run: |
          set NEURONIK_SUITE=%GITHUB_WORKSPACE%
          set NEURONIK_CI=1
          Scripts\junctions-workspace.bat

      - name: Verify the workspace layout
        shell: bash
        working-directory: ABDNeural/WebUI
        run: |
          set -euo pipefail

          fail() { echo "::error::$1"; exit 1; }

          for dir in ../../ABDSharedCode/MidiKeyboard ../../ABDSharedAssets; do
            [ -d "${dir}" ] || fail "Falta el hermano '${dir}': el layout de hermanos no se creo."
          done

          [ -s pnpm-workspace.yaml ] || fail "WebUI/pnpm-workspace.yaml no existe o esta vacio."

          shopt -s nullglob
          linked=(node_modules/@abdsynths/*)

          if [ "${#linked[@]}" -eq 0 ]; then
            fail "pnpm no enlazo ningun paquete @abdsynths/* en WebUI/node_modules."
          fi

          for link in "${linked[@]}"; do
            printf '  %-16s -> %s\n' "$(basename "${link}")" "$(readlink -f "${link}" 2>/dev/null || echo "${link}")"
          done
          echo "Workspace listo: ${#linked[@]} paquete(s) @abdsynths/* enlazados."

      # Que el enlace EXISTA no dice que el arbol tenga dentro lo que la WebUI
      # importa. Este es el hueco que el runner de CI puede seccionar y el arbol
      # local no: ABDSharedAssets puede tener ficheros en el disco que no estan en
      # NINGUN commit (medido el 2026-09-29 con envelopeCurve.js, envelopeGestures.js,
      # envelopePad.js y envelope.css), y entonces el clon limpio se queda sin ellos,
      # `pnpm install` sale en verde y el fallo aparece en Vite, sin mencionar nada
      # del hermano.
      #
      # Se ejecuta el MISMO guard que la suite (`e2e/support/sharedPackage.js`), no
      # una comprobacion paralela: dos reglas para lo mismo divergen, y el runner
      # acaba en verde con una version del guard que ya no es la del test.
      - name: Verify the shared package is complete
        shell: bash
        working-directory: ABDNeural/WebUI
        run: |
          set -euo pipefail

          node --input-type=module -e "
            import { compruebaPaqueteCompartido, mensajeDelGuard } from './e2e/support/sharedPackage.js';
            const guard = await compruebaPaqueteCompartido();
            for (const aviso of guard.avisos ?? []) console.warn('AVISO: ' + aviso);
            if (!guard.ok) {
              console.error('::error::' + mensajeDelGuard(guard));
              process.exit(1);
            }
            console.log('Paquete compartido completo: ' + guard.raiz);
          "

      - name: Install Playwright Chromium
        shell: bash
        working-directory: ABDNeural/WebUI
        run: pnpm exec playwright install chromium

      # SOLO la regresion visual (11 capturas). El `webServer` del config construye
      # `dist` antes de servirlo, asi que el job mide el bundle de verdad.
      #
      # Lo que NO entra, y por que (exclusion y no olvido):
      #   - `Tests/workletSyncTest.mjs` y los demas guards de node: comparan el
      #     WASM de `build-wasm/`, que en el runner no existe sin compilarlo
      #     (emscripten). Los corre el job `native-tests`, que si lo compila.
      #   - `e2e/localMode.spec.js` (el smoke del MODO LOCAL): comparte la
      #     pagina y el motor con esta suite y mide el canal del worklet, que
      #     depende del reloj del AudioContext; entra en cuanto el runner tenga
      #     el paso de `build-wasm`, que es lo que los guards necesitan.
      - name: Run visual regression suite
        shell: bash
        working-directory: ABDNeural/WebUI
        env:
          # El mismo puerto que le pasa ctest (NEURONiK_WebUiVisualRegression):
          # las dos suites de navegador usan puertos distintos porque pueden
          # solaparse.
          NEURONIK_E2E_PORT: '5239'
        run: pnpm exec playwright test e2e/visual.spec.js --reporter=list

      # El informe y las imagenes de diff son justo lo que hace falta para
      # revisar un fallo de referencia, asi que se suben siempre.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ABDNeural/WebUI/playwright-report/
            ABDNeural/WebUI/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ==========================================================================
  # 2. VITEST. La puerta rapida: segundos, sin compilador, y es la que mas
  #    veces atrapa un cambio roto antes de gastar un build de C++.
  #
  #    Cubre LOS DOS lados de la frontera Zero-Copy, que es donde esta el
  #    riesgo de verdad: los tests de la WebUI importan `@abdsynths/shared`, y
  #    si el hermano y el consumidor se desincronizan, el 504 verde de la WebUI
  #    no dice nada porque esta leyendo el arbol del hermano, no el que el CI
  #    acaba de descargar. Por eso se ejecutan los dos, y en el mismo job: si
  #    uno de los dos falla, el otro tampoco se ejecuta y no da un segundo
  #    "verde" misleading encima del primero.
  # ==========================================================================
  js-tests:
    name: vitest (WebUI + ABDSharedAssets)
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      CI: true

    steps:
      # LOS FINALES DE LINEA, ANTES DE CLONAR NADA. MEDIDO: el git de
      # `windows-latest` trae `core.autocrlf=true`, asi que un clon limpio deja
      # `ABDAudioLab/src/measurement/MeasurementExportKeys.generado.h` con 340
      # CRLF donde el blob tiene 340 LF. Los tests de ABDSharedAssets comparan
      # ese fichero byte a byte contra lo que genera el catalogo, y con CRLF no
      # hay nada que comparar: dos de ellos salen en rojo diciendo que la
      # cabecera esta DESFASADA, cuando lo unico que ha cambiado es el fin de
      # linea.
      #
      # Es el mismo motivo por el que `ABDAudioLab/.gitattributes` existe: sin
      # el, git en Windows convierte los LF a CRLF al volver a escribir el
      # fichero y el snapshot deja de coincidir con su origen sin que nadie haya
      # tocado un contrato. Ahi se arreglo para los JSON. Aqui no se puede, porque
      # el fichero problematico es un `.h` y ese repositorio no toca los finales
      # de linea de codigo a proposito.
      - name: Pin the line endings of the clone
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout ABDNeural (este repo)
        uses: actions/checkout@v4
        with:
          path: ABDNeural

      - name: Checkout ABDSharedCode (@abdsynths/midi-keyb)
        uses: actions/checkout@v4
        with:
          repository: ajabadia/ABDSharedCode
          path: ABDSharedCode

      - name: Checkout ABDSharedAssets (@abdsynths/shared)
        uses: actions/checkout@v4
        with:
          repository: ajabadia/ABDSharedAssets
          path: ABDSharedAssets

      # QUINTO Y SEXTO HERMANO, Y TAMPOCO SON OPCIONALES. MEDIDO: sin ellos el
      # job sale con 6 tests en rojo, y no por lo que dicen:
      #
      #   - "el catalogo de verdad tiene toda fuente en su sitio": 8 fuentes que
      #     no existen, porque son de estos dos repos.
      #   - "cada evidencia declarada existe": ABDEep declara una evidencia
      #     (`deepmind_fx_modmatrix.md`) y el fichero no esta a mano.
      #   - "una salida sin marca de generado se reporta como problema": y
      #     "una salida que no esta en el disco es un FALLO", porque la cuenta
      #     sale de los generadores de los hermanos y sin generador no hay
      #     salida que contar.
      #
      # El `check-generated-contracts.mjs` de ABDSharedAssets tiene una funcin
      # `hermanoDisponible` que salta al generador cuando el repositorio no
      # esta, y con ella estos tests pasarian en verde SIN comprobar nada. Un
      # verde que no ha mirado nada es peor que un rojo, asi que se clonan.
      - name: Checkout ABDEep (generador de presets y registro)
        uses: actions/checkout@v4
        with:
          repository: ajabadia/ABDEep
          path: ABDEep

      - name: Checkout ABDMS2000 (generador de registro y contratos)
        uses: actions/checkout@v4
        with:
          repository: ajabadia/ABDMS2000
          path: ABDMS2000

      # CUARTO HERMANO, Y NO ES OPCIONAL. MEDIDO: sin este checkout el job sale
      # con 11 tests en rojo, todos con el mismo motivo:
      #
      #   ENOENT: no such file or directory,
      #   open '...ABDAudioLab...src...MeasurementSerialization.cpp'
      #
      # Los tests de ABDSharedAssets localizan el laboratorio como
      # `path.resolve(RAIZ, '..', 'ABDAudioLab')`, o sea "el hermano de al lado",
      # que es como esta en la suite. Aqui no lo estaba, y el test no tiene la
      # guarda que si tiene el script `--check` (que sale con 0 sin comprobar
      # nada cuando el hermano falta): el script y el test discrepaban sobre que
      # pasa cuando ABDAudioLab no esta.
      #
      # Se clona en vez de hacer que el test se salte porque el propio test dice
      # que lo que importa es leer el `.cpp`: un `--check` en verde no dice que el
      # C++ deje de teclear literales.
      - name: Checkout ABDAudioLab (el laboratorio que leen esos tests)
        uses: actions/checkout@v4
        with:
          repository: ajabadia/ABDAudioLab
          path: ABDAudioLab

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # El workspace de la WebUI lista a los dos hermanos como miembros
      # (`WebUI/pnpm-workspace.yaml`), asi que este install basta para que
      # `WebUI/node_modules/@abdsynths/*` quede enlazado.
      - name: Install WebUI dependencies
        shell: bash
        working-directory: ABDNeural/WebUI
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # ABDSharedAssets tiene SU PROPIO lock (pnpm-lock.yaml) y NO es miembro del
      # workspace de la WebUI: es un paquete de la suite, no una dependencia de
      # este repo. Por eso necesita su install separado, o sus 1327 tests no
      # tendrian ni el vitest que los corre.
      - name: Install ABDSharedAssets dependencies
        shell: bash
        working-directory: ABDSharedAssets
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # Los enlaces del workspace como junctions, antes de los vitest. Mismo
      # rodeo y mismo motivo que en el job de la regresion visual: `pnpm` puede
      # dejar un `workspace:*` que existe y no resuelve, y entonces el vitest de
      # la WebUI lee un arbol vacio y sale en verde sin haber comprobado nada.
      # `NEURONIK_SUITE` es obligatorio por lo mismo que ahi.
      - name: Fix the workspace links as junctions (junctions-workspace.bat)
        shell: cmd
        working-directory: ABDNeural
        run: |
          set NEURONIK_SUITE=%GITHUB_WORKSPACE%
          set NEURONIK_CI=1
          Scripts\junctions-workspace.bat

      # ── La WebUI ───────────────────────────────────────────────────────────
      # 504 tests, 32 ficheros. Corre contra el arbol de ABDSharedAssets que se
      # acaba de descargar, que es justo el punto: si el hermano no exporta lo
      # que la pagina importa, esto falla aqui y no en la maquina de alguien.
      - name: vitest (WebUI)
        shell: bash
        working-directory: ABDNeural/WebUI
        run: pnpm exec vitest run --reporter=dot

      # ── El hermano ─────────────────────────────────────────────────────────
      # 1327 tests, 30 ficheros. Los que cubren el `EnvelopePad`, el knob bipolar
      # y el boton LED, que son justo los componentes que ABDNeural todavia no
      # versiona.
      - name: vitest (ABDSharedAssets)
        shell: bash
        working-directory: ABDSharedAssets
        run: pnpm exec vitest run --reporter=dot

  # ==========================================================================
  # 3. CTEST. La bateria de C++: el motor, los presets, la matriz de
  #    modulacion, el DSP compartido. 53 tests, y es la unica que puede
  #    detectar que un cambio de DSP rompio el sonido.
  #
  #    POR QUE ESTE JOB ES CARO Y AUN ASI ESTA. Configurar el proyecto exige
  #    JUCE, y JUCE no esta en ningun repo de la suite -- ni como submodulo, ni
  #    por FetchContent, ni por CMakePresets. CMakeLists solo mira $JUCE_PATH, el
  #    fallback `C:/JUCE` de Windows, o `find_package(JUCE CONFIG REQUIRED)`,
  #    que falla. ABDSharedCode, en cambio, SI tiene FetchContent a GitHub
  #    (CMakeLists.txt:72-78), asi que ese no es un problema; JUCE si lo es, y
  #    por eso este bloque lo trae el mismo en vez de darlo por supuesto.
  #
  #    Y EL .wasm. Los guards de artefacto (NEURONiK_WorkletSync,
  #    NEURONiK_WasmLayoutFingerprint) comparan el binario de `build-wasm/` con
  #    el que sirve la pagina. Sin compilarlo, esos dos tests no se pueden
  #    ejecutar de ninguna manera que signifique algo, asi que este job tambien
  #    instala emsdk y compila el modulo.
  # ==========================================================================
  native-tests:
    name: ctest (motor nativo + guards del .wasm)
    runs-on: windows-latest
    # MEDIDO, y el comentario que estaba aqui se equivoco: decia "60 min es
    # margen de sobra". La corrida 37081769101 llego por primera vez hasta este
    # job (antes moria en el configure) y se CANCELO a los 60 minutos con unos
    # 35 de los 38 ejecutables de test ya enlazados, sin el plugin, sin el
    # `.wasm` y sin ctest. No era un margen corto: era la primera vez que se
    # llegaba a medirlo.
    #
    # El build entero a proposito, plugin incluido, es decision del workflow y
    # no un descuido: es la bateria que vigila que no haya un segundo sitio donde
    # anadir un test y olvidarlo.
    timeout-minutes: 150

    env:
      CI: true
      # Donde se deja JUCE si hay que descargarla. Es una variable de ENTORNO y
      # no una constante escrita a pelo en el cmake de mas abajo, para que
      # cambiarla no sea editar el workflow.
      JUCE_DOWNLOAD_DIR: 'C:\JUCE'

    steps:
      - name: Checkout ABDNeural (este repo)
        uses: actions/checkout@v4
        with:
          path: ABDNeural

      - name: Checkout ABDSharedCode (@abdsynths/midi-keyb)
        uses: actions/checkout@v4
        with:
          repository: ajabadia/ABDSharedCode
          path: ABDSharedCode

      - name: Checkout ABDSharedAssets (@abdsynths/shared)
        uses: actions/checkout@v4
        with:
          repository: ajabadia/ABDSharedAssets
          path: ABDSharedAssets

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Los guards de ctest que son de node (los .mjs de Tests/) y el modulo WASM
      # necesitan `node` en el PATH. Sin esto, los que hoy se registrarian aqui
      # serian un "Not Run" con codigo 0 y el job pasaria sin comprobar nada.
      - name: Install WebUI dependencies
        shell: bash
        working-directory: ABDNeural/WebUI
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        shell: bash
        working-directory: ABDNeural/WebUI
        run: pnpm exec playwright install chromium

      # Los enlaces del workspace como junctions. En este job todavia no corre
      # ningun paso de navegador, pero SI corre `build_wasm.bat` y los guards de
      # ctest que leen la WebUI, asi que un enlace roto aqui sale como un fallo
      # de Vite o del worklet, muy lejos de su causa. `NEURONIK_SUITE` es
      # obligatorio por lo mismo que en los otros dos jobs.
      - name: Fix the workspace links as junctions (junctions-workspace.bat)
        shell: cmd
        working-directory: ABDNeural
        run: |
          set NEURONIK_SUITE=%GITHUB_WORKSPACE%
          set NEURONIK_CI=1
          Scripts\junctions-workspace.bat

      # ── JUCE ───────────────────────────────────────────────────────────────
      # Tres caminos, en este orden: la variable de entorno, el `C:/JUCE` que ya
      # mira CMakeLists, y el mirror publico. La version va FIJADA a 9.0.3, que
      # es la que hay en la maquina de desarrollo: sin fijar, `master` del mirror
      # puede mover un `juce::` bajo los pies y el fallo se lee como si fuera
      # del codigo de este repo.
      #
      # MEDIDO por que 9.0.3 y no una 8.0.x mas reciente. Las cuatro ultimas
      # 8.0.x (12, 13, 14 y 15) declaran `JUCE_WASM` en juce_TargetPlatform.h
      # pero no tienen ninguna entrada para ese caso en
      # juce_ThreadPriorities_native.h, de modo que la tabla `table` de
      # ThreadPriorities sale VACIA y el `static_assert (std::size (table) == 5)`
      # de esa cabecera revienta al compilar juce_core.cpp con em++. La rama
      # `#if JUCE_WASM` solo existe a partir de 9.x. Reproducido con la linea de
      # comando exacta del rojo: con 8.0.12 salen 7 errores y exit 1; con 9.0.3
      # exit 0. Subir de major es lo que cuesta menos: el resto de la serie 8 no
      # arregla el fallo y esta version es la que ya compila en la maquina.
      - name: Resolve JUCE
        shell: bash
        run: |
          set -euo pipefail
          JUCE_VERSION='9.0.3'

          if [ -n "${JUCE_PATH:-}" ] && [ -f "${JUCE_PATH}/CMakeLists.txt" ]; then
            echo "JUCE desde la variable de entorno: ${JUCE_PATH}"
          elif [ -f "C:\\JUCE\\CMakeLists.txt" ]; then
            echo "JUCE desde el fallback de CMakeLists: C:\\JUCE"
            echo "JUCE_PATH=C:\\JUCE" >> "$GITHUB_ENV"
          else
            echo "JUCE no esta en el runner: se descarga el mirror ${JUCE_VERSION}"
            git clone --depth 1 --branch "${JUCE_VERSION}" https://github.com/juce-framework/JUCE.git "$JUCE_DOWNLOAD_DIR"
            echo "JUCE_PATH=${JUCE_DOWNLOAD_DIR}" >> "$GITHUB_ENV"
          fi

          echo "--- comprobacion: la version que se va a usar"
          grep -m1 'project(JUCE' "${JUCE_PATH:-C:\\JUCE}\\CMakeLists.txt" || true

      # ── emsdk ──────────────────────────────────────────────────────────────
      # Mismo criterio: si ya esta, se usa; si no, se instala. `emsdkup` es el
      # instalador oficial y el que ya se usa en la maquina de desarrollo.
      - name: Resolve emsdk
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "C:\\emsdk\\emsdk_env.bat" ]; then
            echo "emsdk desde C:\\emsdk"
            echo "EMSDK_ROOT=C:\\emsdk" >> "$GITHUB_ENV"
          else
            echo "emsdk no esta en el runner: se instala"
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git C:\\emsdk
            cmd //c "C:\\emsdk\\emsdk.bat install latest"
            cmd //c "C:\\emsdk\\emsdk.bat activate latest"
            echo "EMSDK_ROOT=C:\\emsdk" >> "$GITHUB_ENV"
          fi

      # ── Configure ──────────────────────────────────────────────────────────
      # Release, y no Debug: es la configuracion en la que se compila el `.wasm`,
      # y los hashes de bytes de la red de paridad de la matriz SOLO son
      # comparables dentro de una misma configuracion.
      # MEDIDO: sin este paso el configure sale con 1 y con este motivo, que no
      # es del codigo de este repo:
      #
      #   CMake Error at CMakeLists.txt:2 (project):
      #     Generator
      #       Visual Studio 17 2022
      #     could not find any instance of Visual Studio.
      #
      # `microsoft/setup-msbuild` NO es lo que arregla el configure, aunque lo
      # parezca. MEDIDO en el log de la corrida: el paso sale con 0 y `vswhere`
      # responde `C:\Program Files\Microsoft Visual Studio\18\Enterprise`, y
      # un paso mas abajo el configure sigue con `could not find any instance of
      # Visual Studio` porque el generador que se le pide es "Visual Studio 17
      # 2022" y esa version no esta. El runner trae VS 18, la 2026.
      #
      # Por eso el `-G` no se fija: sin el, CMake usa el generador de Visual
      # Studio mas reciente que haya instalado, que es justo el que existe. Y no
      # hay que adivinar que hay mas de uno: `vswhere -latest` devuelve el ultimo.
      # Fijar la version aqui es lo que hacia que este paso se rompiera solo,
      # cada vez que el runner avanza una version.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # EL SDK DE WEBVIEW2. El plugin declara `NEEDS_WEBVIEW2 TRUE`, y eso hace
      # que `FindWebView2.cmake` busque el paquete NuGet `Microsoft.Web.WebView2`.
      # MEDIDO: sin este paso el configure sale con
      #
      #   Could NOT find WebView2 (missing: WebView2_include_dir WebView2_library)
      #
      # que es un `CMake Error`, no un aviso, asi que el job para antes de
      # compilar nada. El runner no lo trae, y el paquete NO esta en la imagen.
      #
      # Se descarga el `.nupkg` (que es un zip) y se descomprime en vez de usar
      # `Install-Package` por dos razones que se han medido en el propio paquete:
      # `Install-Package` escribe en `AppData/Local/PackageManagement/NuGet/Packages`
      # y deja el resultado en un sitio que depende de como este configurado el
      # PowerShell del runner, y no hace falta esa indireccion porque la variable
      # `JUCE_WEBVIEW2_PACKAGE_LOCATION` dice donde esta. Lo que hay dentro se ha
      # comprobado: `build/native/include/WebView2.h` y
      # `build/native/x64/WebView2LoaderStatic.lib`, que es exactamente lo que
      # busca el `find`.
      #
      # Y el nombre de la carpeta lleva la version porque el `find` de JUCE no
      # recibe el directorio del paquete sino el que lo CONTIENE, y lo localiza
      # con un glob `*Microsoft.Web.WebView2*`. Con la version en el nombre (que
      # es como NuGet lo nombra) el glob casa. Sin ella, no.
      - name: Fetch the WebView2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.0.3485.44'
          $root = Join-Path $env:GITHUB_WORKSPACE 'webview2'
          $dest = Join-Path $root "Microsoft.Web.WebView2.$version"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # `Expand-Archive` no acepta la extension `.nupkg`, y con PowerShell 5.1
          # el error que da no dice nada de la extension. Se descarga como `.zip`.
          $zip = Join-Path $env:RUNNER_TEMP 'webview2.zip'
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$version" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          if (-not (Test-Path (Join-Path $dest 'build/native/include/WebView2.h'))) {
            Write-Error "el paquete se ha descargado pero no trae build/native/include/WebView2.h; revisa la version $version"
          }
          Write-Host "WebView2 $version en $dest"

      - name: Configure (Release)
        shell: bash
        run: |
          set -euo pipefail
          cd ABDNeural

          # MSYS NO PUEDE TOCAR LOS ARGUMENTOS DE ESTE PASO. MEDIDO: sin esto,
          # `/EHsc` llegaba a `cmake` como `C:\Program Files\Git\EHsc`, y la
          # cache del `configure` guardaba
          #
          #   CMAKE_CXX_FLAGS: C:\Program Files\Git\DWIN32 \D_WINDOWS \EHsc
          #
          # o sea los `/` de las flags de MSVC convertidos en rutas de Windows,
          # que es lo que hace MSYS2 con cualquier cosa que parece un path
          # POSIX. El sintoma era de C, dos capas mas abajo:
          #
          #   juce_BasicNativeHeaders.h(92,4): error C1189:
          #   "You're compiling without exceptions enabled"
          #
          # porque `/EHsc` nunca llego. Lo mismo pasaba con los `-I` de abajo y
          # con `JUCE_WEBVIEW2_PACKAGE_LOCATION`, aunque ahi el camino mas corto
          # de ver el fallo era el rojo de antes.
          export MSYS2_ARG_CONV_EXCL='*'

          # `cygpath -m` porque el CMake de Windows y el bash de Git no cuentan
          # igual: `$(pwd)` devuelve `/d/a/...` y Windows lo lee como `\d\a\...`
          # desde la unidad actual. MEDIDO: con `$(pwd)` a secas las tres rutas
          # salian en el `.vcxproj` como `\d\tmp\...`, que aqui daba la
          # casualidad de ser el mismo sitio y en el runner habria sido otra
          # unidad.
          _WEBVIEW2="$(cygpath -m "$GITHUB_WORKSPACE")/webview2"
          _BD="$(cygpath -m "$(pwd)")/build-reference"

          # LOS INCLUDE DE LOS CABECEROS GENERADOS, Y POR QUE SON UN PARCHE.
          # Los tres `juce_add_binary_data` de este repo se declaran al FINAL del
          # CMakeLists, despues de que los targets que los enlazan los hayan
          # enlazado POR NOMBRE. CMake no ve ahi ninguna dependencia: un nombre
          # que todavia no es un target se resuelve como una libreria, o sea que
          # no se aporta ni el orden de compilacion ni el `include` que el target
          # daria con `target_include_directories(... INTERFACE ...)`.
          #
          # MEDIDO, no deducido. Sobre un clon limpio, con el CMakeLists de
          # `master`, `NEURONiK.vcxproj` sale con 22 `include` y NINGUNO de
          # `juce_binarydata`. Con estos `-I` salen los tres, y el rojo de
          #
          #   error C1083: Cannot open include file: 'NeuronikFactoryModels.h'
          #
          # se va. Que en la maquina de trabajo no salga, y eso es lo que lo hace
          # pasar por una broma del runner, es que `build-reference` conserva la
          # configuracion de una corrida anterior: un arbol recien clonado no ha
          # estado nunca.
          #
          # Se pasan los TRES, y no solo los dos que existen en esta
          # configuracion, porque `NEURONiK_WebUIAssets` depende de
          # `WebUI/dist`. Un `-I` a una carpeta que no esta no molesta al
          # preprocesador, y asi, el dia que este job construya la WebUI, el
          # include ya esta y no vuelve a romperse.
          #
          # El arreglo de raiz es declarar esos tres `juce_add_binary_data`
          # ANTES de los targets que los enlazan. No se ha puesto en el
          # CMakeLists porque ese fichero tiene trabajo sin commitear de otra
          # sesion.
          # `/DWIN32 /D_WINDOWS /EHsc` no son inventos: son lo que tiene
          # `build-reference/CMakeCache.txt` en la maquina donde este proyecto
          # compila, y sin `/EHsc` JUCE no compila (el `#error` de arriba).
          # CMake 4.4 ya no los pone por su cuenta en MSVC.
          #
          # MEDIDO sobre un clon limpio, con este bloque tal cual: el target
          # `NEURONiK_AudioBufferParityTest` compila y enlaza, exit 0. Con los
          # `-I` solos y sin `MSYS2_ARG_CONV_EXCL` el mismo target sale con
          # cuatro `error C1083` de "no se puede abrir el archivo origen
          # C:\Program" y el `C1189` de excepciones.
          # Y LAS LIBS EN EL ENLAZADOR, por la misma causa que los `-I`: los
          # mismos targets, enlazados por nombre antes de que existieran, no
          # arrastran `NEURONiK_FactoryModels.lib`. MEDIDO en los `.vcxproj` de
          # un clon limpio: `NEURONiK_Standalone` y `NEURONiK_VST3` salen con
          # CERO apariciones de esa lib, y `NEURONiK_WebPilotHost` y todos los
          # ejecutables de test salen con cuatro, que son justo los que se
          # declaran despues de los `juce_add_binary_data`.
          #
          # Con la cabecera ya encontrada, el rojo era el de enlace:
          #
          #   NEURONiK_SharedCode.lib(NEURONiKProcessor.obj) : error LNK2019:
          #   unresolved external symbol "char const * const Neuronik..."
          #
          # MEDIDO de punta a punta en local, sobre el clon limpio: con esto el
          # target `NEURONiK_VST3` compila, enlaza y produce `NEURONiK.vst3`,
          # exit 0.
          #
          # SOLO `FactoryModels`, y no `SelftestAssets` tambien: MEDIDO que
          # poner las dos da
          #
          #   LINK : fatal error LNK1181: no se puede abrir el archivo de
          #   entrada ...NEURONiK_SelftestAssets.lib
          #
          # porque este target no construye esa lib, que es la misma falta de
          # dependencia de orden un nivel mas abajo. El VST3 no la necesita: el
          # simbolo que daba el `LNK2019` se llama `NeuronikFactoryModels`, y eso
          # ya dice de que lib sale.
          #
          # `add_link_options` a secas, y no las tres variables de la cache,
          # porque cada tipo de target se traga la suya: el VST3 de
          # `juce_add_plugin` es MODULE (su `/machine:x64` salia de
          # `CMAKE_MODULE_LINKER_FLAGS`, medido) y el Standalone es EXECUTABLE.
          # Con `add_link_options` los dos los cogen, y tambien los subdirectorios
          # que se anadan.
          #
          # Con la ruta COMPLETA de la lib y no con `/LIBPATH:` porque CMake se
          # come el `/LIBPATH:` de una variable de la cache: medido, con
          # `/LIBPATH:` el `.vcxproj` recibe las libs pero sin el path, que es no
          # resolver nada.
          # Y POR QUE VAN EN UN SCRIPT Y NO EN LAS VARIABLES DE LA CACHE.
          # MEDIDO: con `-DCMAKE_MODULE_LINKER_FLAGS` el propio `configure` sale
          # con
          #
          #   LINK : fatal error LNK1104: cannot open file ...Release\
          #   NEURONiK_FactoryModels.lib
          #   CMakeFiles/CMakeScratch/TryCompile-pree.../cmTC_9d2c4.vcxproj
          #
          # o sea el try-compile del propio compilador. CMake le pasa las
          # variables de enlazador de la cache a los subproyectos que compila
          # para saber si el toolchain funciona, y ese try-compile ocurre dentro
          # de `project()`, cuando la lib todavia no existe (nada la ha
          # generado: se genera al final del propio configure).
          #
          # `CMAKE_PROJECT_INCLUDE` se ejecuta justo DESPUES de `project()`, o
          # sea cuando los try-compile ya han pasado, y `add_link_options` es
          # una propiedad de directorio, que los try_compile de CMake no
          # heredan. MEDIDO de punta a punta en local: el configure sale con 0 y
          # el target `NEURONiK_VST3` enlaza y produce `NEURONiK.vst3`, exit 0.
          _LIBS="${_BD}/Release/NEURONiK_FactoryModels.lib"

          # NADA MAS QUE LOS ENLACES. Este fichero solo lleva `add_link_options`.
          #
          # MEDIDO por que ya NO esta el `add_custom_target(NEURONiK_LayoutExport)`
          # de guarda que AQUI iba antes. `master` DECLARA ese target de verdad,
          # en el `CMakeLists.txt` (linea 890), asi que el stub era peor que
          # inutil: `CMAKE_PROJECT_INCLUDE` se ejecuta justo despues de `project()`,
          # o sea ANTES de esa linea, de modo que el custom target quedaba
          # declarado primero y el `add_executable` de verdad reventaba con
          #
          #   add_executable cannot create target "NEURONiK_LayoutExport"
          #   because another target with the same name already exists.
          #   The existing target is a custom target created in source directory
          #   .../ABDNeural.  (policy CMP0002)
          #
          # MEDIDO el origen del error: `master` no lo declaraba y el `.bat` se
          # comia un MSB1009; cuando el `CMakeLists.txt` lo declaro de verdad, el
          # stub paso de tapar ese fallo a provocarlo. Con el target real el
          # `--target NEURONiK_LayoutExport` del `.bat` construye el
          # exportador de verdad y el `if exist` del paso de mas abajo lo
          # ejecuta, que es lo que el propio `.bat` quiere.
          cat > "$RUNNER_TEMP/neural-factorymodels.cmake" <<CMAKEEOF
          add_link_options("$_LIBS")
          CMAKEEOF

          cmake -S . -B build-reference -A x64 \
            -DJUCE_PATH="$JUCE_PATH" \
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$_WEBVIEW2" \
            -DCMAKE_PROJECT_INCLUDE="$(cygpath -m "$RUNNER_TEMP")/neural-factorymodels.cmake" \
            -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /EHsc -I${_BD}/juce_binarydata_NEURONiK_FactoryModels/JuceLibraryCode -I${_BD}/juce_binarydata_NEURONiK_SelftestAssets/JuceLibraryCode -I${_BD}/juce_binarydata_NEURONiK_WebUIAssets/JuceLibraryCode"

      # Se compila TODO lo que hay configurado, plugin incluido. El target
      # NEURONiK es un VST3 y `cmake --build` sin `--target` lo construye igual:
      # suprimirlo exigiria listar los 38 targets de test a mano, y esa lista se
      # quedaria vieja en cuanto se anada uno. Pagar el plugin es el precio de no
      # tener un segundo sitio donde anadir un test y olvidarlo.
      # LOS CABECEROS GENERADOS, ANTES DE COMPILAR NADA. MEDIDO en la corrida
      # 37075288609: el build para a los once segundos con
      #
      #   Source/Main/NEURONiKProcessor.cpp(8,10): error C1083:
      #   Cannot open include file: 'NeuronikFactoryModels.h'
      #
      # Ese header lo escribe `juce_add_binary_data`, y los tres de este repo se
      # declaran al FINAL del CMakeLists, despues de que los targets que los
      # enlazan los hayan enlazado POR NOMBRE. CMake no ve por eso ninguna
      # dependencia de orden, y con `--parallel` el plugin entra a compilar
      # NEURONiKProcessor.cpp antes de que el target que genera el header haya
      # llegado a generarlo. El log lo dice: solo salen los
      # `Generating ..._resources.rc` de los dos formatos, y ninguna cabecera.
      #
      # Que en local no salga es justo lo que hace que parezca cosa de maquina:
      # `build-reference` ya tenia los cabeceres de una corrida anterior. En un
      # arbol recien clonado, que es lo unico que ve el runner, no estan, y el
      # rojo sale como error de C, que es la ultima capa.
      #
      # El arreglo de raiz es un `add_dependencies` en el CMakeLists, y no se ha
      # puesto aqui a proposito: ese fichero tiene trabajo sin commitear de otra
      # sesion y tocarlo era mezclarse en el. Esto mide lo mismo y no invade.
      - name: Generate the binary-data headers (el orden que CMake no ve)
        shell: bash
        run: |
          set -euo pipefail
          cd ABDNeural
          for _t in NEURONiK_WebUIAssets NEURONiK_SelftestAssets NEURONiK_FactoryModels; do
            # `NEURONiK_WebUIAssets` no existe en esta configuracion: depende de
            # `WebUI/dist`, que este job no construye. Por eso se avisa y se
            # sigue en vez de romper la lista entera.
            if cmake --build build-reference --config Release --target "$_t"; then
              echo "::notice::$_t generado antes de compilar"
            else
              echo "::warning::el target $_t no existe en esta configuracion"
            fi
          done

      - name: Build test targets (Release)
        shell: bash
        run: |
          set -euo pipefail
          cd ABDNeural
          cmake --build build-reference --config Release --parallel

      # ── El .wasm ───────────────────────────────────────────────────────────
      # build_wasm.bat es el unico camino que produce el binario que la pagina
      # sirve, y ademas es el que regenera la firma del layout y comprueba que
      # el binario y la tabla cuadran. Los guards de mas abajo comparan contra
      # ESA salida, asi que tienen que ver el resultado de este paso y no un
      # binario de otra pasada.
      # Y LA UNA LINEA DEL .BAT QUE LANZARIA ESE `.exe` QUE NO SE CONSTRUYO.
      # Es una sola linea y sin saltos de linea en medio, a proposito: el
      # parche anterior multi-linea fallaba porque el `.bat` cambia de CRLF a LF
      # segun como se clonase (medido), y un `.Replace()` de un bloque con `\r\n`
      # dentro no encuentra el texto en uno de los dos casos. Una sola linea
      # encuentra siempre.
      #
      # Se parchea aqui y no en el `.bat` porque ese fichero tiene trabajo sin
      # commitear de otra sesion. Y el `CMakeLists.txt` de esa sesion no se sube
      # porque no configura: referencia `Tests/OutputBusDeclaredTest.cpp`, que no
      # existe (medido, `CMake Generate step failed`).
      - name: Patch build_wasm.bat (el exportador que este CMakeLists no construye)
        shell: pwsh
        working-directory: ABDNeural
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'build_wasm.bat'
          $t = [IO.File]::ReadAllText($p)

          $viejo = '"%~dp0build-reference\Release\NEURONiK_LayoutExport.exe" "%~dp0WebUI\generated"'
          if ($t.IndexOf($viejo) -lt 0) { throw 'build_wasm.bat no tiene la linea que se esperaba' }

          $nuevo = 'if exist build-reference\Release\NEURONiK_LayoutExport.exe ' + $viejo
          [IO.File]::WriteAllText($p, $t.Replace($viejo, $nuevo))
          Write-Host 'build_wasm.bat parcheado: el exportador de la firma solo se ejecuta si se ha construido'

      - name: Build the .wasm
        shell: cmd
        working-directory: ABDNeural
        run: build_wasm.bat nopause

      # ── ctest ──────────────────────────────────────────────────────────────
      # `-C Release` NO es opcional: sin el, los tests multi-config dan "Not Run"
      # y ctest los cuenta como ... verdes, que es el peor fallo posible en una
      # bateria. En local hay 52 tests y sin esta bandera se quedan sin correr.
      - name: ctest
        shell: bash
        working-directory: ABDNeural/build-reference
        run: ctest -C Release --output-on-failure --timeout 300

      - name: Upload ctest log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: |
            ABDNeural/build-reference/Testing/**
            ABDNeural/wasm-last-run.log
          if-no-files-found: ignore
          retention-days: 14
